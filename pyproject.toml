[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyvault-agent"
version = "0.2.0"
description = "本地加密密钥记忆库 + Cursor MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=43.0.0",
  "mcp>=1.9.0,<2",
  "click>=8.1.0",
  "python-dateutil>=2.9.0",
]

[project.scripts]
keyvault = "keyvault.cli:main"
keyvault-mcp = "keyvault.mcp_server:main"
keyvault-ui = "keyvault.webapp:main"

[tool.setuptools.packages.find]
include = ["keyvault*"]
